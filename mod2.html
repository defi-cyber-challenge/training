<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slideshow Template</title>
  <style>
    :root {
      --bg0: #050816;
      --bg1: #0b1631;
      --panel: rgba(255, 255, 255, 0.96);
      --text: #1b2433;
      --muted: #5d6b82;
      --line: #d9e2ef;
      --accent: #4f7cff;
      --accent2: #18c4b8;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
      --card-w: 1100px;
      --card-h: 760px;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 94, 158, 0.28), transparent 22%),
        radial-gradient(circle at 85% 18%, rgba(24, 196, 184, 0.24), transparent 24%),
        radial-gradient(circle at 70% 82%, rgba(255, 197, 61, 0.18), transparent 20%),
        radial-gradient(circle at 22% 84%, rgba(79, 124, 255, 0.20), transparent 24%),
        linear-gradient(135deg, #090c1a 0%, #111f45 34%, #2a1351 68%, #0d2a2c 100%);
    }

    .scene {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(#CCCCCC 1px, transparent 1px),
        linear-gradient(90deg, #CCCCCC 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 78%);
    }

    .card {
      width: min(var(--card-w), calc(100vw - 48px));
      height: min(var(--card-h), calc(100vh - 48px));
      background: var(--panel);
      border: 1px solid rgba(217, 226, 239, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .header {
      position: relative;
      padding: 26px 30px 18px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .title {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 1rem;
      color: var(--muted);
      min-height: 1.4em;
    }

    .badgeImage {
      position: absolute;
      top: 10px;
      right: 16px;
      height: 78%;
      max-height: 140px;
      width: auto;
      object-fit: contain;
      pointer-events: none;
    }

    .content {
      flex: 1 1 auto;
      min-height: 0;
      padding: 22px 30px 18px;
      overflow: auto;
      line-height: 1.65;
      color: #243041;
    }

    .content h2,
    .content h3,
    .content p {
      margin-top: 0;
    }

    .content p {
      margin-bottom: 14px;
    }

    .content ul {
      margin: 0 0 16px 20px;
      padding: 0;
    }

    .content li {
      margin-bottom: 8px;
    }

    .introWrap {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .introText {
      flex: 1 1 58%;
      min-width: 0;
    }

    .introImage {
      flex: 0 0 34%;
      max-width: 34%;
      align-self: flex-start;
      margin: 4px 0 0;
    }

    .introImage img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
    }

    .slideImage {
      display: block;
      width: 100%;
      max-height: 100%;
      object-fit: contain;
      margin: 12px auto 0;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
    }

    .mobileImage {
      height: 150px;
      width: auto;
      display: block;
      margin: 10px auto 14px;
    }

    
    .floatRightImage {
      float: right;
      width: 240px;
      max-width: 42%;
      height: auto;
      margin: 4px 0 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
    }
.warningCallout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(210, 72, 72, 0.35);
      border-left: 5px solid #d24848;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 240, 240, 0.96), rgba(255, 248, 248, 0.98));
    }

    .warningIcon {
      font-size: 1.4rem;
      line-height: 1;
      margin-top: 1px;
    }

    .warningText {
      color: #5b2b2b;
    }

    .pillarGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .pillarGrid.twoCol {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .pillarGrid.fourCol {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .processFlow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
      margin-top: 18px;
    }

    .processStep {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, #fbfcff, #f2f7ff);
      padding: 18px 16px;
      min-height: 190px;
      display: grid;
      gap: 10px;
      align-content: start;
      text-align: center;
      box-shadow: 0 10px 24px rgba(79, 124, 255, 0.08);
    }

    .processStepNum {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 800;
    }

    .processArrow {
      display: grid;
      place-items: center;
      font-size: 2rem;
      color: var(--accent);
      font-weight: 800;
    }

    .processStep .dropZone {
      width: 100%;
      margin-top: 8px;
    }

    .pillarCard {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfcff;
      padding: 14px 16px;
    }

    .pillarIcon {
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 8px;
      text-align: center;
    }

    .pillarCard h3 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      text-align: center;
    }

    .pillarCard ul {
      margin: 0 0 0 18px;
    }

    .pillarCard li {
      margin-bottom: 6px;
    }

    .definitionGrid {
      display: grid;
      gap: 14px;
      margin-top: 10px;
    }

    .definitionCard {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfcff;
      padding: 14px 16px;
    }

    .definitionTerm {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 1.02rem;
    }

    .matchBank {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 14px;
      justify-content: center;
    }

    .matchWord {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: grab;
      font-weight: 700;
      user-select: none;
      white-space: nowrap;
    }

    .matchWord.dragging {
      opacity: 0.45;
    }

    .matchGrid {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .matchRow {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .matchDef {
      border: 1px solid var(--line);
      background: #fbfcff;
      border-radius: 14px;
      padding: 12px 14px;
    }

    .dropZone {
      border: 2px dashed #b7c4d8;
      background: #fdfefe;
      border-radius: 14px;
      padding: 12px 14px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .dropZone.dragover {
      border-color: var(--accent);
      background: #eef4ff;
    }

    .dropZone.correct {
      border-color: #2db57d;
      background: rgba(45, 181, 125, 0.10);
    }

    .dropZone.wrong {
      border-color: #e26b6b;
      background: rgba(226, 107, 107, 0.10);
    }

    .tfWrap {
      display: grid;
      gap: 14px;
      margin-top: 10px;
      justify-items: center;
    }

    .tfQuestion {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfcff;
      padding: 16px;
      max-width: 720px;
    }

    .tfButtons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tfBtn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      min-width: 120px;
    }

    .tfBtn.correct {
      border-color: #2db57d;
      background: rgba(45, 181, 125, 0.12);
    }

    .tfBtn.wrong {
      border-color: #e26b6b;
      background: rgba(226, 107, 107, 0.12);
    }

    .activityFeedback {
      margin-top: 10px;
      color: var(--muted);
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .phishWrap {
      display: grid;
      gap: 14px;
      margin-top: 8px;
      position: relative;
    }

    .emailBox {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fbfcff;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .emailHeader {
      display: grid;
      gap: 6px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.94rem;
    }

    .emailSubject {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
    }

    .emailBody {
      display: grid;
      gap: 12px;
      line-height: 1.6;
    }

    .hotspot {
      color: inherit;
      background: rgba(255, 232, 232, 0.8);
      border-bottom: 2px dotted #d24848;
      padding: 1px 3px;
      border-radius: 4px;
      cursor: pointer;
    }

    .phishChecklist {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .phishTag {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .phishTag.done {
      border-color: #2db57d;
      background: rgba(45, 181, 125, 0.12);
      color: #246d52;
    }

    .popupOverlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(12, 20, 36, 0.45);
      border-radius: 18px;
      padding: 18px;
    }

    .popupCard {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 18px;
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.18);
    }

    .popupCard h3 {
      margin: 0 0 10px;
    }

    .popupClose {
      margin-top: 14px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .quiz {
      display: grid;
      gap: 18px;
    }

    .question {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfcff;
    }

    .question h3 {
      margin: 0 0 12px;
      font-size: 1.02rem;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
          font: inherit;
      line-height: 1.65;
    }

    .choice.correct {
      border-color: #2db57d;
      background: rgba(45, 181, 125, 0.12);
    }

    .choice.wrong {
      border-color: #e26b6b;
      background: rgba(226, 107, 107, 0.12);
    }

    .scoreBox {
      margin-top: 6px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f4f8ff;
      font-weight: 700;
      text-align: center;
    }

    .footer {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      align-items: center;
      gap: 16px;
      padding: 16px 22px 22px;
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(248,251,255,1));
    }

    .arrow {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
    }

    .arrow:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .arrow:disabled {
      opacity: 0.35;
      cursor: default;
      box-shadow: none;
    }

    .progressWrap {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .progressLabel {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .progressBar {
      width: min(360px, 100%);
      height: 10px;
      background: #e8eef7;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .progressFill {
      height: 100%;
      width: 33.333%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.25s ease;
    }

    @media (max-width: 720px) {
      .scene { padding: 12px; }
      .card { width: calc(100vw - 24px); height: calc(100vh - 24px); }
      .header, .content { padding-left: 18px; padding-right: 18px; }
      .footer { padding-left: 14px; padding-right: 14px; grid-template-columns: 52px 1fr 52px; }
      .arrow { width: 44px; height: 44px; }
      .title { font-size: 1.35rem; }
      .progressBar { width: min(240px, 100%); }
      .pillarGrid,
      .pillarGrid.twoCol,
      .processFlow { grid-template-columns: 1fr; }
      .processArrow { transform: rotate(90deg); }
      .introWrap { flex-direction: column; }
      .introImage { max-width: 100%; flex-basis: auto; }
      .matchRow { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <section class="card" aria-label="Slideshow">
      <header class="header">
        <h1 class="title" id="title">Malware</h1>
        <div class="subtitle" id="subtitle">Module 2</div>
        <img class="badgeImage" src="mdbadge.png" alt="" aria-hidden="true" />
      </header>

      <main class="content" id="content" tabindex="0"></main>

      <footer class="footer">
        <button class="arrow" id="prevBtn" aria-label="Previous slide">&larr;</button>

        <div class="progressWrap" aria-label="Progress">
          <div class="progressLabel" id="progressLabel">1 of 3</div>
          <div class="progressBar" aria-hidden="true">
            <div class="progressFill" id="progressFill"></div>
          </div>
        </div>

        <button class="arrow" id="nextBtn" aria-label="Next slide">&rarr;</button>
      </footer>
    </section>
  </div>

  <script>
    const slides = [
      {
        subtitle: "Module 2",
        content: [
          "<div class='introWrap'>",
          "<div class='introText'>",
          "<h2>What is malware?</h2>",
          "<p>Malware is short for malicious software. It is software designed to damage devices, steal information, disrupt systems, spy on users or give attackers unauthorised access.</p>",
          "<p>Malware can affect computers, phones, tablets, servers and networks.</p>",

      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>Types of Malware</h2>",
          "<div class='pillarGrid'>",
          "<div class='pillarCard'><h3>Virus</h3><p>A virus attaches itself to a legitimate file or program.</p><ul><li>It usually needs a user to open or run the infected file.</li><li>It can copy itself into other files.</li><li>It may corrupt data, damage software or slow down a device.</li></ul></div>",
          "<div class='pillarCard'><h3>Worm</h3><p>A worm is designed to spread automatically.</p><ul><li>It can move across networks without the user opening a file.</li><li>It often exploits security weaknesses.</li><li>It can spread very quickly and overload systems or networks.</li></ul></div>",
          "<div class='pillarCard'><h3>Trojan</h3><p>A trojan disguises itself as legitimate or useful software.</p><ul><li>The user is tricked into installing it.</li><li>It does not usually copy itself.</li><li>It may create a back door, steal data or install additional malware.</li></ul></div>",
          "</div>",
          "<p>These are classic types of malware that have been around for decades.</p>"
        ]
      },
      {
        subtitle: "Module 2",
        content: [
          "<div class='introWrap'>",
          "<div class='introText'>",
          "<h2>Spyware</h2>",
          "<p>Spyware secretly monitors a user or device.</p>",
          "<ul><li>It may collect browsing activity, messages or personal information.</li><li>A keylogger records what a person types.</li><li>Keyloggers can steal passwords, bank details and private messages.</li></ul>",
          "<p><strong>Spyware commonly comes from:</strong></p>",
          "<ul><li><strong>Free software bundles:</strong> Spyware may be hidden inside free utilities, media players, PDF tools or \"system cleaners.\"</li><li><strong>Pirated or cracked software:</strong> Modified installers frequently contain credential stealers and other malware.</li><li><strong>Infected USB devices:</strong> Spyware can sometimes be introduced through removable storage.</li></ul>",
          "<div class='warningCallout'><div class='warningIcon'>&#9888;&#65039;</div><div class='warningText'><strong>Did you know?</strong> Choosing the \"stay logged in\" option or saving bank details can limit how much keyloggers can record.</div></div>",
          "</div>",
          "<div class='introImage'><img src='spyware.png' alt='Spyware illustration' /></div>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 2",
        content: [
          "<div class='introWrap'>",
          "<div class='introText'>",
          "<h2>Ransomware</h2>",
          "<p>Ransomware blocks access to files or systems and demands payment.</p>",
          "<p>Ransomware commonly enters through unpatched software, stolen credentials, phishing emails or exposed remote-access systems. Critical infrastructure-especially healthcare, government, manufacturing and energy-is heavily targeted, while smaller organisations are often particularly vulnerable because they have fewer cybersecurity resources.</p>",
          "<ul><li>It often encrypts the victim's files.</li><li>Attackers may also threaten to publish stolen information.</li><li>Paying the ransom does not guarantee that the files will be restored.</li></ul>",
          "</div>",
          "<div class='introImage'><img src='ransomware.png' alt='Ransomware illustration' /></div>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 2",
        mcq: true,
        question: "A classmate says malware is just any computer problem that makes a device act strangely. Which answer best explains what malware actually means?",
        choices: ["Malicious software designed to harm, disrupt, spy on, or gain unauthorised access", "A hardware fault caused by overheating or damaged parts", "A software update that changes how a device behaves", "A slow internet connection that affects downloads and websites"],
        correctAnswer: 0,
        correctFeedback: "Correct. Malware means malicious software designed to harm, disrupt, spy on users, or give attackers unauthorised access.",
        incorrectFeedback: "Not quite. Malware means malicious software designed to harm, disrupt, spy on users, or give attackers unauthorised access.",
        content: []
      },
      {
        subtitle: "Module 2",
        tf: true,
        question: "A keylogger is a type of spyware that records what a person types.",
        correctAnswer: true,
        correctFeedback: "Correct. A keylogger records keystrokes and is often used to steal sensitive information.",
        incorrectFeedback: "Not quite. A keylogger records keystrokes and is often used to steal sensitive information.",
        content: []
      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>Common Ways Malware Spreads</h2>",
          "<img class='floatRightImage' src='malware2.png' alt='Malware spreading illustration' />",
          "<ul><li>Phishing emails containing malicious links or attachments</li><li>Downloading software from untrusted websites</li><li>Installing fake apps, updates or browser extensions</li><li>Using pirated or cracked software</li><li>Visiting compromised websites</li><li>Connecting infected USB drives or other devices</li><li>Exploiting outdated software and unpatched security weaknesses</li><li>Using weak or stolen passwords to access systems</li></ul>"
        ]
      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>How Malware Can Be Prevented</h2>",
          "<img class='floatRightImage' src='malware3.jpg' alt='Malware prevention illustration' />",
          "<ul><li>Keep operating systems, apps and browsers updated.</li><li>Use reputable antivirus and security software.</li><li>Do not open unexpected links or attachments.</li><li>Download software only from trusted sources.</li><li>Limit administrator access.</li><li>Back up important files regularly.</li><li>Scan USB drives and external devices.</li><li>Provide cybersecurity awareness training.</li></ul>"
        ]
      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>How Antivirus Software Works</h2>",
          "<p>Antivirus software scans files, programs and system activity for signs of malware.</p>",
          "<p>It can detect threats in several ways:</p>",
          "<ul><li><strong>Signatures:</strong> Compares files with a database of known malware patterns.</li><li><strong>Behaviour monitoring:</strong> Looks for suspicious actions, such as mass file encryption or attempts to change system settings.</li><li><strong>Heuristic analysis:</strong> Examines unfamiliar files for characteristics commonly associated with malware.</li><li><strong>Quarantine:</strong> Isolates suspicious files so they cannot run or spread.</li><li><strong>Removal:</strong> Deletes or repairs infected files where possible.</li></ul>",
          "<div class='warningCallout'><div class='warningIcon'>&#9888;&#65039;</div><div class='warningText'>Antivirus software reduces risk, but it cannot stop every threat. It works best alongside updates, secure passwords, backups and careful user behaviour.</div></div>"
        ]
      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>How Antivirus Software Works</h2>",
          "<p>Antivirus software can checks files, downloads, websites and attachments as they are opened. It can also scan your device for malware that is lurking.</p>",
          "<div class='processFlow'>",
          "<div class='processStep'><div class='processStepNum'>1</div><h3>Scan</h3><p>Scans files for matches in databases of known malware.</p></div>",
          "<div class='processArrow' aria-hidden='true'>&rarr;</div>",
          "<div class='processStep'><div class='processStepNum'>2</div><h3>Alert</h3><p>Alerts you when a match is identified or a suspect program attempts to run.</p></div>",
          "<div class='processArrow' aria-hidden='true'>&rarr;</div>",
          "<div class='processStep'><div class='processStepNum'>3</div><h3>Quarantine and Remove</h3><p>Quarantines and removes infected files.</p></div>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 2",
        dragMatch: true,
        matchPrompt: "Drag each keyword to the correct definition.",
        matchItems: [
          {
            word: "Signatures",
            definition: "Compares files with a database of known malware patterns."
          },
          {
            word: "Heuristic analysis",
            definition: "Examines unfamiliar files for characteristics commonly associated with malware."
          }
        ],
        content: []
      },
      {
        subtitle: "Module 2",
        dragMatch: true,
        processLayout: true,
        matchPrompt: "Drag each label into the correct order to show how antivirus responds to threats.",
        matchPendingText: "Place all three labels in the correct order to continue.",
        matchSuccessText: "All three labels are in the correct order. You can continue.",
        matchItems: [
          {
            word: "Scan"
          },
          {
            word: "Alert"
          },
          {
            word: "Quarantine and Remove"
          }
        ],
        content: []
      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>Why Antivirus Updates Matter</h2>",
          "<p>Keeping antivirus software up to date is important because <strong>new malware is created and changed constantly</strong>.</p>",
          "<p>Updates provide:</p>",
          "<ul>",
          "<li><strong>New threat signatures</strong> so recently discovered malware can be recognised.</li>",
          "<li><strong>Improved detection methods</strong> for unfamiliar or modified threats.</li>",
          "<li><strong>Security fixes</strong> for weaknesses in the antivirus software itself.</li>",
          "<li><strong>Better protection</strong> against new phishing, ransomware and spyware techniques.</li>",
          "</ul>"
        ]
      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>Picking an Antivirus</h2>",
          "<p><strong>For most home users, Microsoft Defender—the free antivirus built into Windows 11—is good enough.</strong> It provides real-time malware protection, firewall integration and protection against suspicious downloads and websites.</p>",
          "<p>A paid package may provide more tools and convenience, but paying does not automatically mean substantially better malware detection.</p>",
          "<p>Avoid running two real-time antivirus programs simultaneously, as they can conflict; Windows normally places Defender into passive mode when compatible third-party antivirus is installed.</p>"
        ]
      },
      {
        subtitle: "Module 2",
        content: [
          "<h2>Conclusion</h2>",
          "<p>Malware can take many forms, but safe habits, updated software and antivirus protection can reduce the risk.</p>",
          "<p>Stay alert, keep your device protected and return to the desktop to continue your training.</p>"
        ]
      }
    ];

    let index = 0;

    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const content = document.getElementById("content");
    const progressLabel = document.getElementById("progressLabel");
    const progressFill = document.getElementById("progressFill");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    let quizState = [];
    let matchState = null;
    let tfStates = {};
    let mcqStates = {};
    let phishingState = null;

    function isMatchComplete(slide) {
      if (slide && slide.matchItems) {
        return matchState && matchState.__slideIndex === index && slide.matchItems.every(function (item, idx) {
          return matchState["slot" + idx] === item.word;
        });
      }
      return matchState && matchState.confidentiality === "Confidentiality" && matchState.integrity === "Integrity" && matchState.availability === "Availability";
    }

    function renderMatch(slide) {
      if (slide.matchItems) {
        if (!matchState || matchState.__slideIndex !== index) {
          matchState = { __slideIndex: index };
          slide.matchItems.forEach(function (item, idx) {
            matchState["slot" + idx] = null;
          });
        }

        var wordBank = slide.matchItems.map(function (item) {
          return item.word;
        }).filter(function (word) {
          return slide.matchItems.every(function (item, idx) {
            return matchState["slot" + idx] !== word;
          });
        });

        var pendingText = slide.matchPendingText || (slide.matchItems.length === 2 ? "Match both terms correctly to continue." : "Match all terms correctly to continue.");
        var successText = slide.matchSuccessText || (slide.matchItems.length === 2 ? "Both terms are correct. You can continue." : "All terms are correct. You can continue.");
        var matchBody = "";

        if (slide.processLayout) {
          matchBody = "<div class='processFlow'>" + slide.matchItems.map(function (item, idx) {
            var value = matchState["slot" + idx];
            var stepHtml = "<div class='processStep'><div class='processStepNum'>" + (idx + 1) + "</div><div class='dropZone " + (value ? "correct" : "") + "' data-key='" + idx + "'>" + (value ? "<span class='matchWord'>" + value + "</span>" : "Drop label here") + "</div></div>";
            if (idx < slide.matchItems.length - 1) {
              stepHtml += "<div class='processArrow' aria-hidden='true'>&rarr;</div>";
            }
            return stepHtml;
          }).join("") + "</div>";
        } else {
          matchBody = "<div class='matchGrid'>" + slide.matchItems.map(function (item, idx) {
            var value = matchState["slot" + idx];
            return "<div class='matchRow'><div class='dropZone " + (value ? "correct" : "") + "' data-key='" + idx + "'>" + (value ? "<span class='matchWord'>" + value + "</span>" : "Drop here") + "</div><div class='matchDef'>" + item.definition + "</div></div>";
          }).join("") + "</div>";
        }

        content.innerHTML = [
          "<h2>Match the terms</h2>",
          "<p>" + (slide.matchPrompt || "Drag each word to the correct definition.") + "</p>",
          "<div class='matchBank'>" + wordBank.map(function (word) {
            return "<div class='matchWord' draggable='true' data-word='" + word + "'>" + word + "</div>";
          }).join("") + "</div>",
          matchBody,
          "<div class='activityFeedback' id='activityFeedback'>" + pendingText + "</div>"
        ].join("");

        content.querySelectorAll(".matchWord[draggable='true']").forEach(function (word) {
          word.addEventListener("dragstart", function (e) {
            e.dataTransfer.setData("text/plain", word.getAttribute("data-word"));
            word.classList.add("dragging");
          });
          word.addEventListener("dragend", function () {
            word.classList.remove("dragging");
          });
        });

        content.querySelectorAll(".dropZone").forEach(function (zone) {
          zone.addEventListener("dragover", function (e) {
            e.preventDefault();
            zone.classList.add("dragover");
          });
          zone.addEventListener("dragleave", function () {
            zone.classList.remove("dragover");
          });
          zone.addEventListener("drop", function (e) {
            e.preventDefault();
            zone.classList.remove("dragover");
            var word = e.dataTransfer.getData("text/plain");
            var key = Number(zone.getAttribute("data-key"));
            var ok = slide.matchItems[key].word === word;
            if (!ok) {
              var feedback = document.getElementById("activityFeedback");
              if (feedback) {
                feedback.textContent = "That does not match. Try another term.";
              }
              return;
            }
            matchState["slot" + key] = word;
            render();
          });
        });

        nextBtn.disabled = !isMatchComplete(slide);
        var customMatchFeedback = document.getElementById("activityFeedback");
        if (customMatchFeedback) {
          customMatchFeedback.textContent = isMatchComplete(slide) ? successText : pendingText;
        }
        return;
      }

      if (!matchState) {
        matchState = {
          confidentiality: null,
          integrity: null,
          availability: null
        };
      }

      var wordBank = ["Confidentiality", "Integrity", "Availability"].filter(function (word) {
        return [matchState.confidentiality, matchState.integrity, matchState.availability].indexOf(word) === -1;
      });

      content.innerHTML = [
        "<h2>Match the terms</h2>",
        "<p>Drag each word to the correct definition.</p>",
        "<div class='matchBank'>" + wordBank.map(function (word) {
          return "<div class='matchWord' draggable='true' data-word='" + word + "'>" + word + "</div>";
        }).join("") + "</div>",
        "<div class='matchGrid'>",
        "<div class='matchRow'><div class='dropZone " + (matchState.confidentiality ? "correct" : "") + "' data-key='confidentiality'>" + (matchState.confidentiality ? "<span class='matchWord'>" + matchState.confidentiality + "</span>" : "Drop here") + "</div><div class='matchDef'>Keeping information private from people who should not see it.</div></div>",
        "<div class='matchRow'><div class='dropZone " + (matchState.integrity ? "correct" : "") + "' data-key='integrity'>" + (matchState.integrity ? "<span class='matchWord'>" + matchState.integrity + "</span>" : "Drop here") + "</div><div class='matchDef'>Keeping information correct and preventing unwanted changes.</div></div>",
        "<div class='matchRow'><div class='dropZone " + (matchState.availability ? "correct" : "") + "' data-key='availability'>" + (matchState.availability ? "<span class='matchWord'>" + matchState.availability + "</span>" : "Drop here") + "</div><div class='matchDef'>Keeping information accessible to authorized users when they need it.</div></div>",
        "</div>",
        "<div class='activityFeedback' id='activityFeedback'>Match all three terms correctly to continue.</div>"
      ].join("");

      content.querySelectorAll(".matchWord[draggable='true']").forEach(function (word) {
        word.addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("text/plain", word.getAttribute("data-word"));
          word.classList.add("dragging");
        });
        word.addEventListener("dragend", function () {
          word.classList.remove("dragging");
        });
      });

      content.querySelectorAll(".dropZone").forEach(function (zone) {
        zone.addEventListener("dragover", function (e) {
          e.preventDefault();
          zone.classList.add("dragover");
        });
        zone.addEventListener("dragleave", function () {
          zone.classList.remove("dragover");
        });
        zone.addEventListener("drop", function (e) {
          e.preventDefault();
          zone.classList.remove("dragover");
          var word = e.dataTransfer.getData("text/plain");
          var key = zone.getAttribute("data-key");
          var ok = (key === "confidentiality" && word === "Confidentiality") ||
                   (key === "integrity" && word === "Integrity") ||
                   (key === "availability" && word === "Availability");
          if (!ok) {
            var feedback = document.getElementById("activityFeedback");
            if (feedback) {
              feedback.textContent = "That does not match. Try another term.";
            }
            return;
          }
          matchState[key] = word;
          render();
        });
      });

      nextBtn.disabled = !isMatchComplete(slide);
      var matchFeedback = document.getElementById("activityFeedback");
      if (matchFeedback) {
        matchFeedback.textContent = isMatchComplete(slide) ? "All three terms are correct. You can continue." : "Match all three terms correctly to continue.";
      }
    }

    function renderMultipleChoice(slide) {
      if (!mcqStates[index]) {
        mcqStates[index] = {
          attempted: false,
          answered: null,
          correct: false
        };
      }
      var mcqState = mcqStates[index];
      var feedbackText = "";
      if (mcqState.attempted) {
        feedbackText = mcqState.correct ? slide.correctFeedback : slide.incorrectFeedback;
      }

      var html = [
        "<h2>Multiple Choice</h2>",
        "<div class='tfWrap'>",
        "<div class='tfQuestion'>" + slide.question + "</div>",
        "<div class='choices'>"
      ];

      slide.choices.forEach(function (choice, ci) {
        var buttonClass = "choice";
        if (mcqState.attempted) {
          if (ci === slide.correctAnswer) {
            buttonClass += " correct";
          } else if (ci === mcqState.answered) {
            buttonClass += " wrong";
          }
        }
        html.push("<button class='" + buttonClass + "' data-c='" + ci + "'" + (mcqState.attempted ? " disabled" : "") + ">" + choice + "</button>");
      });

      html.push("</div>");
      html.push("<div class='activityFeedback" + (mcqState.attempted ? "" : " hidden") + "' id='activityFeedback'>" + feedbackText + "</div>");
      html.push("</div>");
      content.innerHTML = html.join("");

      content.querySelectorAll(".choice").forEach(function (button) {
        button.addEventListener("click", function () {
          if (mcqState.attempted) {
            return;
          }
          var value = Number(button.getAttribute("data-c"));
          mcqState.attempted = true;
          mcqState.answered = value;
          mcqState.correct = value === slide.correctAnswer;
          render();
        });
      });

      nextBtn.disabled = !mcqState.attempted;
    }

    function renderTrueFalse(slide) {
      if (!tfStates[index]) {
        tfStates[index] = {
          attempted: false,
          answered: null,
          correct: false
        };
      }
      var tfState = tfStates[index];
      var trueClass = "";
      var falseClass = "";
      if (tfState.attempted) {
        if (tfState.answered === true) {
          trueClass = tfState.correct ? "correct" : "wrong";
        }
        if (tfState.answered === false) {
          falseClass = tfState.correct ? "correct" : "wrong";
        }
        if (slide.correctAnswer === true && tfState.answered !== true) {
          trueClass = "correct";
        }
        if (slide.correctAnswer === false && tfState.answered !== false) {
          falseClass = "correct";
        }
      }
      var feedbackText = "";
      if (tfState.attempted) {
        feedbackText = tfState.correct ? slide.correctFeedback : slide.incorrectFeedback;
      }

      content.innerHTML = [
        "<h2>True or False?</h2>",
        "<div class='tfWrap'>",
        "<div class='tfQuestion'>" + slide.question + "</div>",
        "<div class='tfButtons'>",
        "<button class='tfBtn " + trueClass + "' data-value='true'" + (tfState.attempted ? " disabled" : "") + ">True</button>",
        "<button class='tfBtn " + falseClass + "' data-value='false'" + (tfState.attempted ? " disabled" : "") + ">False</button>",
        "</div>",
        "<div class='activityFeedback" + (tfState.attempted ? "" : " hidden") + "' id='activityFeedback'>" + feedbackText + "</div>",
        "</div>"
      ].join("");

      content.querySelectorAll(".tfBtn").forEach(function (button) {
        button.addEventListener("click", function () {
          if (tfState.attempted) {
            return;
          }
          var value = button.getAttribute("data-value") === "true";
          tfState.attempted = true;
          tfState.answered = value;
          tfState.correct = value === slide.correctAnswer;
          content.querySelectorAll(".tfBtn").forEach(function (b) {
            b.disabled = true;
            var buttonValue = b.getAttribute("data-value") === "true";
            if (buttonValue === value) {
              b.classList.add(tfState.correct ? "correct" : "wrong");
            }
            if (buttonValue === slide.correctAnswer) {
              b.classList.add("correct");
            }
          });
          var feedback = document.getElementById("activityFeedback");
          if (feedback) {
            feedback.classList.remove("hidden");
            feedback.textContent = tfState.correct
              ? slide.correctFeedback
              : slide.incorrectFeedback;
          }
          nextBtn.disabled = false;
        });
      });

      nextBtn.disabled = !tfState.attempted;
    }

    function isPhishingComplete() {
      return phishingState &&
        phishingState.urgent &&
        phishingState.sender &&
        phishingState.attachment &&
        phishingState.request &&
        !phishingState.openKey;
    }

    function renderPhishing(slide) {
      if (!phishingState) {
        phishingState = {
          urgent: false,
          sender: false,
          attachment: false,
          request: false,
          openKey: null
        };
      }

      var status = {
        urgent: phishingState.urgent ? "done" : "",
        sender: phishingState.sender ? "done" : "",
        attachment: phishingState.attachment ? "done" : "",
        request: phishingState.request ? "done" : ""
      };

      var popups = {
        urgent: {
          title: "Urgent or threatening language",
          text: "Phishing messages often try to create panic so you act before thinking. If a message pushes you to respond immediately or threatens consequences, pause and verify it."
        },
        sender: {
          title: "Suspicious sender address",
          text: "A misspelled or unusual sender address is a common red flag. Attackers often use addresses that look almost real to trick people into trusting the message."
        },
        attachment: {
          title: "Unexpected links or attachments",
          text: "A message that includes an unexpected attachment or asks you to click a link should be treated carefully. These may lead to fake login pages or malicious files."
        },
        request: {
          title: "Requests for passwords or personal details",
          text: "Legitimate organizations should not ask you to send passwords, one-time codes, or sensitive personal details through email. Requests like this are a major warning sign."
        }
      };

      var overlay = "";
      if (phishingState.openKey) {
        overlay = "<div class='popupOverlay'><div class='popupCard'><h3>" +
          popups[phishingState.openKey].title +
          "</h3><p>" +
          popups[phishingState.openKey].text +
          "</p><button class='popupClose' id='popupCloseBtn'>Close</button></div></div>";
      }

      content.innerHTML = [
        "<h2>Phising Emails</h2>",
        "<p>Look at the sample email below and identify the warning signs. Open each callout to learn why it is suspicious.</p>",
        "<div class='phishWrap'>",
        "<div class='phishChecklist'>",
        "<div class='phishTag " + status.urgent + "'>Urgent language</div>",
        "<div class='phishTag " + status.sender + "'>Sender address</div>",
        "<div class='phishTag " + status.attachment + "'>Links or attachments</div>",
        "<div class='phishTag " + status.request + "'>Sensitive requests</div>",
        "</div>",
        "<div class='emailBox'>",
        "<div class='emailHeader'>",
        "<div><strong>From:</strong> <span class='hotspot' data-clue='sender'>billing@streamfIix-support.com</span></div>",
        "<div><strong>To:</strong> alex.taylor@example.com</div>",
        "<div><strong>Date:</strong> Mon, 20 Jul, 9:14 AM</div>",
        "<div class='emailSubject'>Payment Issue: Your StreamFlix subscription will be cancelled today</div>",
        "</div>",
        "<div class='emailBody'>",
        "<p>Hello Alex,</p>",
        "<p>We were unable to process your monthly payment for your Premium Family plan. <span class='hotspot' data-clue='urgent'>Your account is scheduled for cancellation today at 11:59 PM, and you may lose your watch history and saved profiles unless you act immediately.</span></p>",
        "<p>To prevent service interruption, please review your billing details by downloading <span class='hotspot' data-clue='attachment'>Streaming-Statement.zip</span> or by selecting the secure verification link below:</p>",
        "<p><u>Update Billing Information</u></p>",
        "<p><span class='hotspot' data-clue='request'>For security verification, reply to this email with your account password, the 6-digit code sent to your phone, and your billing postal code.</span></p>",
        "<p>If you have already updated your payment details, please disregard this final notice.</p>",
        "<p>Thank you,<br>StreamFlix Billing Team</p>",
        "</div>",
        "</div>",
        "<div class='activityFeedback' id='activityFeedback'>" + (isPhishingComplete() ? "All four warning signs have been reviewed. You can continue." : "Open and close all four warning signs to continue.") + "</div>",
        overlay,
        "</div>"
      ].join("");

      content.querySelectorAll(".hotspot").forEach(function (item) {
        item.addEventListener("click", function () {
          var clue = item.getAttribute("data-clue");
          phishingState.openKey = clue;
          render();
        });
      });

      var closeBtn = document.getElementById("popupCloseBtn");
      if (closeBtn) {
        closeBtn.addEventListener("click", function () {
          if (phishingState.openKey) {
            phishingState[phishingState.openKey] = true;
            phishingState.openKey = null;
          }
          render();
        });
      }

      nextBtn.disabled = !isPhishingComplete();
    }

    function renderQuiz(slide) {
      if (quizState.length !== slide.questions.length) {
        quizState = slide.questions.map(function () {
          return { answered: false, correct: false };
        });
      }

      var html = ['<div class="quiz">'];
      slide.questions.forEach(function (item, qi) {
        html.push('<div class="question" data-q="' + qi + '">');
        html.push('<h3>' + (qi + 1) + '. ' + item.q + '</h3>');
        html.push('<div class="choices">');
        item.choices.forEach(function (choice, ci) {
          html.push('<button class="choice" data-q="' + qi + '" data-c="' + ci + '">' + choice + '</button>');
        });
        html.push('</div></div>');
      });
      html.push('<div class="scoreBox" id="scoreBox">Score: 0 / ' + slide.questions.length + '</div>');
      html.push('</div>');
      content.innerHTML = html.join("");

      content.querySelectorAll(".choice").forEach(function (button) {
        button.addEventListener("click", function () {
          var qi = Number(button.getAttribute("data-q"));
          var ci = Number(button.getAttribute("data-c"));
          var q = slide.questions[qi];
          if (quizState[qi].answered) {
            return;
          }
          quizState[qi].answered = true;
          quizState[qi].correct = ci === q.answer;

          var container = content.querySelector('.question[data-q="' + qi + '"]');
          container.querySelectorAll(".choice").forEach(function (b, idx) {
            b.disabled = true;
            if (idx === q.answer) {
              b.classList.add("correct");
            } else if (idx === ci) {
              b.classList.add("wrong");
            }
          });
          updateScore(slide);
        });
      });

      updateScore(slide);
    }

    function updateScore(slide) {
      var completed = quizState.every(function (item) {
        return item.answered;
      });
      var score = quizState.filter(function (item) {
        return item.correct;
      }).length;
      var scoreBox = document.getElementById("scoreBox");
      if (scoreBox) {
        scoreBox.textContent = "Score: " + score + " / " + slide.questions.length;
      }
      nextBtn.disabled = !completed;
    }

    function render() {
      const slide = slides[index];
      subtitle.textContent = slide.subtitle;
      if (slide.dragMatch) {
        renderMatch(slide);
      } else if (slide.mcq) {
        renderMultipleChoice(slide);
      } else if (slide.tf) {
        renderTrueFalse(slide);
      } else if (slide.phishing) {
        renderPhishing(slide);
      } else if (slide.quiz) {
        renderQuiz(slide);
      } else {
        content.innerHTML = slide.content.join("");
        nextBtn.disabled = false;
      }
      progressLabel.textContent = (index + 1) + " of " + slides.length;
      progressFill.style.width = (((index + 1) / slides.length) * 100) + "%";
      prevBtn.disabled = index === 0;
    }

    prevBtn.addEventListener("click", function () {
      if (index > 0) {
        index -= 1;
        render();
      }
    });

    nextBtn.addEventListener("click", function () {
      if (slides[index].dragMatch && !isMatchComplete(slides[index])) {
        return;
      }
      if (slides[index].mcq && (!mcqStates[index] || !mcqStates[index].attempted)) {
        return;
      }
      if (slides[index].tf && (!tfStates[index] || !tfStates[index].attempted)) {
        return;
      }
      if (slides[index].phishing && !isPhishingComplete()) {
        return;
      }
      if (slides[index].quiz) {
        var completed = quizState.every(function (item) {
          return item.answered;
        });
        if (!completed) {
          return;
        }
      }
      if (index === slides.length - 1) {
        window.location.href = "desktop.html";
        return;
      }
      if (index < slides.length - 1) {
        index += 1;
        render();
      }
    });

    render();
  </script>
</body>
</html>
