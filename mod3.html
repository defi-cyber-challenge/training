<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Control - Module 3</title>
  <style>
    :root {
      --bg0: #050816;
      --bg1: #0b1631;
      --panel: rgba(255, 255, 255, 0.96);
      --text: #1b2433;
      --muted: #5d6b82;
      --line: #d9e2ef;
      --accent: #4f7cff;
      --accent2: #18c4b8;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
      --card-w: 1100px;
      --card-h: 760px;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 94, 158, 0.28), transparent 22%),
        radial-gradient(circle at 85% 18%, rgba(24, 196, 184, 0.24), transparent 24%),
        radial-gradient(circle at 70% 82%, rgba(255, 197, 61, 0.18), transparent 20%),
        radial-gradient(circle at 22% 84%, rgba(79, 124, 255, 0.20), transparent 24%),
        linear-gradient(135deg, #090c1a 0%, #111f45 34%, #2a1351 68%, #0d2a2c 100%);
    }

    .scene {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        linear-gradient(#CCCCCC 1px, transparent 1px),
        linear-gradient(90deg, #CCCCCC 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 78%);
    }

    .card {
      width: min(var(--card-w), calc(100vw - 48px));
      height: min(var(--card-h), calc(100vh - 48px));
      background: var(--panel);
      border: 1px solid rgba(217, 226, 239, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .header {
      position: relative;
      padding: 26px 30px 18px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .title {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 1rem;
      color: var(--muted);
      min-height: 1.4em;
    }

    .badgeImage {
      position: absolute;
      top: 10px;
      right: 16px;
      height: 78%;
      max-height: 140px;
      width: auto;
      object-fit: contain;
      pointer-events: none;
    }

    .content {
      flex: 1 1 auto;
      min-height: 0;
      padding: 22px 30px 18px;
      overflow: auto;
      line-height: 1.65;
      color: #243041;
    }

    .content h2,
    .content h3,
    .content p {
      margin-top: 0;
    }

    .content p {
      margin-bottom: 14px;
    }

    .content ul {
      margin: 0 0 16px 20px;
      padding: 0;
    }

    .content li {
      margin-bottom: 8px;
    }

    .floatLeftImage {
      float: left;
      width: 240px;
      max-width: 42%;
      height: auto;
      margin: 4px 18px 14px 0;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
    }

    .floatRightImage {
      float: right;
      width: 240px;
      max-width: 42%;
      height: auto;
      margin: 4px 0 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #000;
    }

    .infoCallout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(79, 124, 255, 0.35);
      border-left: 5px solid #4f7cff;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(240, 245, 255, 0.96), rgba(248, 251, 255, 0.98));
    }

    .infoIcon {
      font-size: 1.4rem;
      line-height: 1;
      margin-top: 1px;
    }

    .infoText {
      color: #1e3a6e;
    }

    .pillarGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .pillarGrid.twoCol {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .pillarGrid.fourCol {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .pillarCard {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfcff;
      padding: 14px 16px;
    }

    .pillarIcon {
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 8px;
      text-align: center;
    }

    .pillarCard h3 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      text-align: center;
    }

    .pillarCard p {
      text-align: center;
    }

    .pillarCard ul {
      margin: 0 0 0 18px;
    }

    .pillarCard li {
      margin-bottom: 6px;
    }

    .tfWrap {
      display: grid;
      gap: 14px;
      margin-top: 10px;
      justify-items: stretch;
      width: 100%;
    }

    .tfQuestion {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fbfcff;
      padding: 16px;
      max-width: none;
      width: 100%;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .tfButtons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tfBtn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 12px 28px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      min-width: 120px;
    }

    .tfBtn.correct {
      border-color: #2db57d;
      background: rgba(45, 181, 125, 0.12);
    }

    .tfBtn.wrong {
      border-color: #e26b6b;
      background: rgba(226, 107, 107, 0.12);
    }

    .tfFeedback {
      max-width: none;
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fbfcff;
      color: var(--text);
      line-height: 1.6;
    }

    .iaaaMatchWrap {
      display: grid;
      gap: 14px;
      margin-top: 8px;
    }

    .matchBank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 4px 0 6px;
    }

    .matchWord,
    .placedWord {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      user-select: none;
      white-space: nowrap;
    }

    .matchWord {
      cursor: grab;
    }

    .matchWord.dragging {
      opacity: 0.45;
    }

    .placedWord {
      background: #f4f8ff;
      cursor: pointer;
    }

    .matchGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .matchRow {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      align-items: stretch;
    }

    .matchTerm {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcff;
      padding: 12px 14px;
      font-weight: 700;
      text-align: center;
    }

    .dropZone {
      border: 2px dashed #b7c4d8;
      background: #fdfefe;
      border-radius: 14px;
      padding: 12px 14px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .dropZone.dragover {
      border-color: var(--accent);
      background: #eef4ff;
    }

    .dropZone.filled {
      border-style: solid;
      border-color: #9eb0cb;
    }

    .activityFeedback {
      color: var(--muted);
      text-align: center;
      min-height: 1.5em;
    }

    .videoSlide {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .videoEmbed {
      width: 100%;
      height: 100%;
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #000;
    }

    .mythTable {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .mythTable th,
    .mythTable td {
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
    }

    .mythTable tr:last-child td {
      border-bottom: 0;
    }

    .mythTable th {
      background: #f4f8ff;
      font-size: 1rem;
    }

    .footer {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      align-items: center;
      gap: 16px;
      padding: 16px 22px 22px;
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(248,251,255,1));
    }

    .arrow {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
    }

    .arrow:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .arrow:disabled {
      opacity: 0.35;
      cursor: default;
      box-shadow: none;
    }

    .progressWrap {
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .progressLabel {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .progressBar {
      width: min(360px, 100%);
      height: 10px;
      background: #e8eef7;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .progressFill {
      height: 100%;
      width: 33.333%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.25s ease;
    }

    @media (max-width: 720px) {
      .scene { padding: 12px; }
      .card { width: calc(100vw - 24px); height: calc(100vh - 24px); }
      .header, .content { padding-left: 18px; padding-right: 18px; }
      .footer { padding-left: 14px; padding-right: 14px; grid-template-columns: 52px 1fr 52px; }
      .arrow { width: 44px; height: 44px; }
      .title { font-size: 1.35rem; }
      .progressBar { width: min(240px, 100%); }
      .pillarGrid,
      .pillarGrid.twoCol { grid-template-columns: 1fr; }
      .matchGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <section class="card" aria-label="Slideshow">
      <header class="header">
        <h1 class="title" id="title">Access Control</h1>
        <div class="subtitle" id="subtitle">Module 3</div>
        <img class="badgeImage" src="mdbadge.png" alt="" aria-hidden="true" />
      </header>

      <main class="content" id="content" tabindex="0"></main>

      <footer class="footer">
        <button class="arrow" id="prevBtn" aria-label="Previous slide">&larr;</button>

        <div class="progressWrap" aria-label="Progress">
          <div class="progressLabel" id="progressLabel">1 of 17</div>
          <div class="progressBar" aria-hidden="true">
            <div class="progressFill" id="progressFill"></div>
          </div>
        </div>

        <button class="arrow" id="nextBtn" aria-label="Next slide">&rarr;</button>
      </footer>
    </section>
  </div>

  <script>
    const slides = [
      {
        subtitle: "Module 3",
        content: [
          "<h2>IAAA Access Control Process</h2>",
          "<p>The IAAA process helps systems decide who a user is, whether that identity is genuine, what that user can access and how their actions are traced.</p>",
          "<p>Together, these four steps support secure access control and help protect information and systems.</p>",
          "<div class='pillarGrid fourCol'>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128100;</div><h3>Identification</h3><p>Providing user identity to a system.</p></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128272;</div><h3>Authentication</h3><p>Verifying the user identity.</p></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128273;</div><h3>Authorization</h3><p>Determining whether a user is allowed to access certain resources.</p></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128202;</div><h3>Accountability</h3><p>Holding users responsible for their actions on a system.</p></div>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<img class='floatLeftImage' src='identification.png' alt='Identification illustration' />",
          "<div style='overflow:hidden'>",
          "<h2>Identification</h2>",
          "<p><strong>Identification</strong> is determined when a user claims who they are by providing a unique identifier, such as:</p>",
          "<ul>",
          "<li>Username</li>",
          "<li>Email address</li>",
          "<li>Employee or student ID</li>",
          "<li>Account number</li>",
          "<li>Smart card or security token ID</li>",
          "<li>Biometric profile, such as a stored fingerprint identity</li>",
          "</ul>",
          "<p>Identification only answers <strong>&ldquo;Who are you claiming to be?&rdquo;</strong></p>",
          "<p>Authentication then checks whether that claim is genuine.</p>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Authentication</h2>",
          "<p><strong>Authentication</strong> is the process of verifying that a user really is who they claim to be.</p>",
          "<p>It usually checks one or more of the following:</p>",
          "<div class='pillarGrid'>",
          "<div class='pillarCard'><div class='pillarIcon'>&#129504;</div><h3>Something you know</h3><p>Password or PIN</p></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128241;</div><h3>Something you have</h3><p>Phone, security token or smart card</p></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128400;</div><h3>Something you are</h3><p>Fingerprint, face or other biometric</p></div>",
          "</div>",
          "<p style='margin-top:14px'>Authentication is important because it prevents unauthorized users from accessing accounts, systems and sensitive information.</p>",
          "<div class='infoCallout'><div class='infoIcon'>&#8505;&#65039;</div><div class='infoText'><strong>Multi-Factor Authentication (MFA)</strong> uses at least two of these. For example, a password (something you know) plus a code sent to your phone (something you have).</div></div>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Threats to Authentication</h2>",
          "<div class='pillarGrid twoCol'>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128272;</div><h3>Brute-Force Attack</h3><p>Attempts to discover a password by systematically testing every possible combination of letters, numbers and special characters.</p><ul><li>Longer and more complex passwords take much longer to crack.</li><li>Automated software can test large numbers of passwords very quickly.</li><li>Account lockouts and rate limits can reduce the effectiveness of these attacks.</li></ul></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128218;</div><h3>Dictionary Attack</h3><p>Tests passwords using lists of common words, phrases and frequently used passwords.</p><ul><li>It may also test predictable variations, such as <strong>Password1!</strong></li><li>It is usually faster than testing every possible combination.</li><li>Users who choose common or simple passwords are particularly vulnerable.</li></ul></div>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Threats to Authentication</h2>",
          "<div class='pillarGrid twoCol'>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128260;</div><h3>Credential Stuffing</h3><p>Attackers use usernames and passwords stolen from one service to try to access accounts on other services.</p><ul><li>It succeeds when people reuse the same password.</li><li>Unique passwords prevent one breached account from compromising others.</li></ul></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128273;</div><h3>Password Spraying</h3><p>Attackers try a small number of common passwords against many different accounts.</p><ul><li>This may avoid account lockouts.</li><li>Examples include seasonal passwords or company-name variations.</li></ul></div>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Multi-Factor Authentication</h2>",
          "<p><strong>Multi-factor authentication (MFA)</strong> is important because it requires more than just a password.</p>",
          "<p>Even when an attacker steals or guesses a password through brute force, phishing, credential stuffing or keylogging, they may still be unable to access the account without the second factor.</p>",
          "<p>It is strongest when using an authenticator app, passkey or physical security key. SMS codes are still better than passwords alone, but they can be vulnerable to SIM-swapping and interception.</p>",
          "<div class='pillarGrid'>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128241;</div><h3>Authenticator App</h3><p>Generates a time-based code on your device. Not tied to your phone number.</p></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128273;</div><h3>Passkey / Security Key</h3><p>A physical or cryptographic key. The strongest form of MFA.</p></div>",
          "<div class='pillarCard'><div class='pillarIcon'>&#128172;</div><h3>SMS Code</h3><p>A code sent by text. Better than a password alone, but vulnerable to SIM-swapping.</p></div>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 3",
        tf: true,
        question: "The process of identification includes using a password or a code from your phone to log in.",
        correctAnswer: false,
        correctFeedback: "Correct! Identification is simply the act of claiming who you are — for example, by entering a username. Using a password or a phone code to verify that claim is <strong>authentication</strong>, not identification. Authentication comes after identification and checks whether the claimed identity is genuine.",
        incorrectFeedback: "Not quite. Identification only involves claiming who you are — for example, entering a username. Verifying that claim using a password, PIN or phone code is the job of <strong>authentication</strong>, which is the next step in the process. The two steps are distinct: identification says who you are, authentication proves it."
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Secure Passwordds</h2>",
          "<p>A secure password helps stop other people from getting into your accounts, stealing your information, or pretending to be you.</p>",
          "<p><strong>Weak passwords are easier to guess or crack, especially if you reuse them on different sites.</strong> Using a long, unique password for each account&mdash;and turning on MFA&mdash;makes your accounts much harder to break into.</p>",
          "<div class='infoCallout'><div class='infoIcon'>&#8505;&#65039;</div><div class='infoText'>Don't reuse passwords between different sites. But if you do, use different ones for important accounts like banking and email (because this is where your password reset links will be sent).</div></div>",
          "<p>Different security organizations have slightly different password recommendations. On the next slide we'll look at what the Canadian Centre for Cyber Security recommends.</p>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<div class='videoSlide'>",
          "<h2>Canadian Centre for Cyber Security Password Guidance</h2>",
          "<iframe class='videoEmbed' src='https://www.youtube-nocookie.com/embed/YeUFL3GTFT0?rel=0' title='Canadian Centre for Cyber Security password recommendations' referrerpolicy='strict-origin-when-cross-origin' allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture' allowfullscreen></iframe>",
          "<p>If the video does not load here, <a href='https://youtu.be/YeUFL3GTFT0' target='_blank' rel='noopener noreferrer'>watch it on YouTube</a>.</p>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Password Managers</h2>",
          "<img class='floatRightImage' src='passwordmanager.jpg' alt='Password manager illustration' />",
          "<p>A password manager is a secure application that stores and organizes your passwords in an encrypted vault.</p>",
          "<p>You only need to remember one strong <strong>master password</strong>. The password manager can then create, save and enter unique passwords for your different accounts.</p>",
          "<h3>Benefits</h3>",
          "<ul>",
          "<li><strong>Creates strong passwords:</strong> Generates long, random passwords that are difficult to guess or crack.</li>",
          "<li><strong>Prevents password reuse:</strong> Makes it easier to use a different password for every account.</li>",
          "<li><strong>Reduces memory burden:</strong> You do not need to remember dozens of complicated passwords.</li>",
          "<li><strong>Syncs across devices:</strong> Passwords can be securely available on computers, phones and tablets.</li>",
          "</ul>",
          "<p>A password manager makes it practical to use a strong, unique password for every account.</p>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Misconceptions About Passwords</h2>",
          "<table class='mythTable'>",
          "<thead><tr><th>Myths</th><th>Reality</th></tr></thead>",
          "<tbody>",
          "<tr><td>&ldquo;My password is so obvious that hackers won&rsquo;t try it.&rdquo;</td><td> Passwords such as <strong>password</strong>, <strong>123456</strong> and <strong>qwerty</strong> are among the first guesses made by automated cracking tools.</td></tr>",
          "<tr><td>&ldquo;Replacing letters with symbols makes a password secure.&rdquo;</td><td> Changes such as <strong>Password &rarr; P@ssw0rd</strong> are predictable. Password-cracking tools automatically test these common substitutions.</td></tr>",
          "<tr><td>&ldquo;Hackers would not be interested in my account.&rdquo;</td><td>Attackers often target large numbers of ordinary users automatically. Any account may provide money, personal information or access to other people.</td></tr>",
          "</tbody>",
          "</table>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<div class='videoSlide'>",
          "<h2>Password Security Video</h2>",
          "<iframe class='videoEmbed' src='https://www.youtube-nocookie.com/embed/tthbSeHagDc?rel=0' title='Password security video' referrerpolicy='strict-origin-when-cross-origin' allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture' allowfullscreen></iframe>",
          "<p>If the video does not load here, <a href='https://www.youtube.com/watch?v=tthbSeHagDc' target='_blank' rel='noopener noreferrer'>watch it on YouTube</a>.</p>",
          "</div>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Authorization</h2>",
          "<p><strong>Authorization</strong> determines what an authenticated user is allowed to access or do within a system.</p>",
          "<p>It controls access to files, applications, devices, data and other resources based on the user's role or permissions.</p>",
          "<h3>Common Authorization Methods</h3>",
          "<ul>",
          "<li><strong>File permissions:</strong> Controls who can view, edit, or delete a file.</li>",
          "<li><strong>Account and Role Management:</strong> Users are assigned accounts, roles or groups that determine their level of access.",
          "<ul>",
          "<li>Administrators may manage the whole system.</li>",
          "<li>Employees may access work-related resources.</li>",
          "<li>Guests may have limited or read-only access.</li>",
          "</ul>",
          "</li>",
          "</ul>",
          "<h3>Why Authorization Matters</h3>",
          "<p>Authorization helps prevent unauthorised access, limits accidental changes and ensures users only have the permissions needed for their role.</p>"
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Accountability</h2>",
          "<p><strong>Accountability</strong> means users can be held responsible for the actions they perform on a system.</p>",
          "<p>It ensures that activity can be traced back to a specific person, account or device.</p>",
          "<h3>How Accountability Is Achieved</h3>",
          "<ul>",
          "<li><strong>Audit logs:</strong> Systems record logins, file access, changes and other activity.</li>",
          "<li><strong>Timestamps:</strong> Actions are recorded with the date and time they occurred.</li>",
          "<li><strong>Access records:</strong> Organisations can review who accessed specific systems or data.</li>",
          "<li><strong>Monitoring and alerts:</strong> Suspicious or unauthorised activity can be detected and investigated.</li>",
          "</ul>",
          "<p>Accountability answers the question: &ldquo;Who did what, and when?&rdquo;</p>"
        ]
      },
      {
        subtitle: "Module 3",
        iaaaDrag: true,
        prompt: "Drag each example to the correct IAAA term.",
        matchItems: [
          { key: "identification", term: "Identification", example: "username" },
          { key: "authentication", term: "Authentication", example: "password" },
          { key: "authorization", term: "Authorization", example: "permissions" },
          { key: "accountability", term: "Accountability", example: "audit log" }
        ],
        conclusion: "Great work. Identification claims identity, authentication verifies it, authorization grants access, and accountability records what happened."
      },
      {
        subtitle: "Module 3",
        tfMulti: true,
        questions: [
          {
            question: "A good password should be long, unique, and difficult for others to guess.",
            correctAnswer: true,
            correctFeedback: "Correct. Strong passwords are typically longer, unique for each account, and not based on personal details or common words.",
            incorrectFeedback: "Not quite. A strong password should be long, unique, and difficult to guess. Short or reused passwords are much easier to crack."
          },
          {
            question: "Reusing the same password across multiple accounts is low risk as long as the password is strong.",
            correctAnswer: false,
            correctFeedback: "Correct. Reusing passwords is risky because one breach can expose your other accounts, even if the password itself is strong.",
            incorrectFeedback: "Not quite. Password reuse is a major risk. If one site is breached, attackers can try the same password on your email, banking, and other accounts."
          }
        ]
      },
      {
        subtitle: "Module 3",
        content: [
          "<h2>Module 3 Summary</h2>",
          "<p>Access control uses the IAAA process to protect systems and data:</p>",
          "<ul>",
          "<li><strong>Identification</strong> claims who a user is.</li>",
          "<li><strong>Authentication</strong> verifies that claim.</li>",
          "<li><strong>Authorization</strong> limits what the user can access or do.</li>",
          "<li><strong>Accountability</strong> records activity so actions can be traced and reviewed.</li>",
          "</ul>",
          "<p>Together, these controls reduce risk and help keep information secure.</p>"
        ]
      }
    ];

    let index = 0;
    let tfStates = {};
    let tfMultiStates = {};
    let iaaaMatchStates = {};

    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const content = document.getElementById("content");
    const progressLabel = document.getElementById("progressLabel");
    const progressFill = document.getElementById("progressFill");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function isIaaaMatchComplete(slide, state) {
      return slide.matchItems.every(function (item) {
        return state[item.key] === item.example;
      });
    }

    function renderTrueFalse(slide) {
      if (!tfStates[index]) {
        tfStates[index] = { attempted: false, answered: null, correct: false };
      }
      var state = tfStates[index];
      var trueClass = "", falseClass = "";
      if (state.attempted) {
        trueClass = state.answered === true ? (state.correct ? "correct" : "wrong") : (slide.correctAnswer === true ? "correct" : "");
        falseClass = state.answered === false ? (state.correct ? "correct" : "wrong") : (slide.correctAnswer === false ? "correct" : "");
      }
      var feedbackHtml = state.attempted
        ? "<div class='tfFeedback'>" + (state.correct ? slide.correctFeedback : slide.incorrectFeedback) + "</div>"
        : "";

      content.innerHTML = [
        "<div class='tfWrap'>",
        "<div class='tfQuestion'>" + slide.question + "</div>",
        "<div class='tfButtons'>",
        "<button class='tfBtn " + trueClass + "' data-value='true'" + (state.attempted ? " disabled" : "") + ">True</button>",
        "<button class='tfBtn " + falseClass + "' data-value='false'" + (state.attempted ? " disabled" : "") + ">False</button>",
        "</div>",
        feedbackHtml,
        "</div>"
      ].join("");

      content.querySelectorAll(".tfBtn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (state.attempted) return;
          var value = btn.getAttribute("data-value") === "true";
          state.attempted = true;
          state.answered = value;
          state.correct = value === slide.correctAnswer;
          nextBtn.disabled = false;
          renderTrueFalse(slide);
        });
      });

      nextBtn.disabled = !state.attempted;
    }

    function renderTrueFalseMulti(slide) {
      if (!tfMultiStates[index]) {
        tfMultiStates[index] = slide.questions.map(function () {
          return { attempted: false, answered: null, correct: false };
        });
      }
      var states = tfMultiStates[index];

      var parts = ["<div class='tfWrap'>"];
      if (slide.heading) {
        parts.unshift("<h2>" + slide.heading + "</h2>");
      }
      if (slide.intro) {
        parts.splice(slide.heading ? 1 : 0, 0, "<p>" + slide.intro + "</p>");
      }

      slide.questions.forEach(function (q, qi) {
        var state = states[qi];
        var trueClass = "";
        var falseClass = "";
        if (state.attempted) {
          trueClass = state.answered === true ? (state.correct ? "correct" : "wrong") : (q.correctAnswer === true ? "correct" : "");
          falseClass = state.answered === false ? (state.correct ? "correct" : "wrong") : (q.correctAnswer === false ? "correct" : "");
        }

        parts.push("<div class='tfQuestion'><strong>Question " + (qi + 1) + ":</strong> " + q.question + "</div>");
        parts.push("<div class='tfButtons'>");
        parts.push("<button class='tfBtn " + trueClass + "' data-q='" + qi + "' data-value='true'" + (state.attempted ? " disabled" : "") + ">True</button>");
        parts.push("<button class='tfBtn " + falseClass + "' data-q='" + qi + "' data-value='false'" + (state.attempted ? " disabled" : "") + ">False</button>");
        parts.push("</div>");
        if (state.attempted) {
          parts.push("<div class='tfFeedback'>" + (state.correct ? q.correctFeedback : q.incorrectFeedback) + "</div>");
        }
      });

      parts.push("</div>");
      content.innerHTML = parts.join("");

      content.querySelectorAll(".tfBtn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var qi = Number(btn.getAttribute("data-q"));
          var question = slide.questions[qi];
          var state = states[qi];
          if (state.attempted) {
            return;
          }
          var value = btn.getAttribute("data-value") === "true";
          state.attempted = true;
          state.answered = value;
          state.correct = value === question.correctAnswer;
          renderTrueFalseMulti(slide);
        });
      });

      nextBtn.disabled = !states.every(function (state) {
        return state.attempted;
      });
    }

    function renderIaaaMatch(slide) {
      if (!iaaaMatchStates[index]) {
        iaaaMatchStates[index] = { feedback: "" };
      }
      var state = iaaaMatchStates[index];
      var usedWords = slide.matchItems.map(function (item) {
        return state[item.key];
      }).filter(function (value) {
        return Boolean(value);
      });
      var wordBank = slide.matchItems.map(function (item) {
        return item.example;
      }).filter(function (word) {
        return usedWords.indexOf(word) === -1;
      });
      var complete = isIaaaMatchComplete(slide, state);
      var feedback = state.feedback;
      if (complete) {
        feedback = "All matches are correct. " + slide.conclusion;
      }

      content.innerHTML = [
        "<h2>IAAA Match Activity</h2>",
        "<p>" + slide.prompt + "</p>",
        "<div class='iaaaMatchWrap'>",
        "<div class='matchBank'>" + wordBank.map(function (word) {
          return "<div class='matchWord' draggable='true' data-word='" + word + "'>" + word + "</div>";
        }).join("") + "</div>",
        "<div class='matchGrid'>" + slide.matchItems.map(function (item) {
          var assigned = state[item.key];
          return "<div class='matchRow'>" +
            "<div class='matchTerm'>" + item.term + "</div>" +
            "<div class='dropZone " + (assigned ? "filled" : "") + "' data-key='" + item.key + "'>" +
            (assigned ? "<span class='placedWord' data-key='" + item.key + "' title='Click to remove'>" + assigned + "</span>" : "Drop here") +
            "</div></div>";
        }).join("") + "</div>",
        "<div class='activityFeedback'>" + feedback + "</div>",
        "</div>"
      ].join("");

      content.querySelectorAll(".matchWord").forEach(function (wordEl) {
        wordEl.addEventListener("dragstart", function (e) {
          e.dataTransfer.setData("text/plain", wordEl.getAttribute("data-word"));
          wordEl.classList.add("dragging");
        });
        wordEl.addEventListener("dragend", function () {
          wordEl.classList.remove("dragging");
        });
      });

      content.querySelectorAll(".dropZone").forEach(function (zone) {
        zone.addEventListener("dragover", function (e) {
          e.preventDefault();
          zone.classList.add("dragover");
        });
        zone.addEventListener("dragleave", function () {
          zone.classList.remove("dragover");
        });
        zone.addEventListener("drop", function (e) {
          e.preventDefault();
          zone.classList.remove("dragover");
          var word = e.dataTransfer.getData("text/plain");
          var key = zone.getAttribute("data-key");
          var item = slide.matchItems.find(function (entry) {
            return entry.key === key;
          });
          if (!item) {
            return;
          }
          if (word !== item.example) {
            state.feedback = "That match is not correct yet. Try again.";
            renderIaaaMatch(slide);
            return;
          }
          state[key] = word;
          state.feedback = "";
          renderIaaaMatch(slide);
        });
      });

      content.querySelectorAll(".placedWord").forEach(function (placedWord) {
        placedWord.addEventListener("click", function () {
          var key = placedWord.getAttribute("data-key");
          delete state[key];
          state.feedback = "";
          renderIaaaMatch(slide);
        });
      });

      nextBtn.disabled = !complete;
    }

    function render() {
      const slide = slides[index];
      subtitle.textContent = slide.subtitle;
      if (slide.tf) {
        renderTrueFalse(slide);
      } else if (slide.tfMulti) {
        renderTrueFalseMulti(slide);
      } else if (slide.iaaaDrag) {
        renderIaaaMatch(slide);
      } else {
        content.innerHTML = slide.content.join("");
        nextBtn.disabled = false;
      }
      progressLabel.textContent = (index + 1) + " of " + slides.length;
      progressFill.style.width = (((index + 1) / slides.length) * 100) + "%";
      prevBtn.disabled = index === 0;
    }

    prevBtn.addEventListener("click", function () {
      if (index > 0) {
        index -= 1;
        render();
      }
    });

    nextBtn.addEventListener("click", function () {
      var slide = slides[index];
      if (slide.tf && (!tfStates[index] || !tfStates[index].attempted)) {
        return;
      }
      if (slide.tfMulti && (!tfMultiStates[index] || !tfMultiStates[index].every(function (state) { return state.attempted; }))) {
        return;
      }
      if (slide.iaaaDrag && !isIaaaMatchComplete(slide, iaaaMatchStates[index] || {})) {
        return;
      }
      if (index < slides.length - 1) {
        index += 1;
        render();
      } else {
        window.location.href = "desktop.html";
      }
    });

    render();
  </script>
</body>
</html>
