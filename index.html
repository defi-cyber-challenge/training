<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <style>
    :root {
      --bg-1: #071428;
      --bg-2: #12345c;
      --bg-3: #2a6faa;
      --panel: rgba(15, 23, 42, 0.2);
      --panel-strong: rgba(10, 18, 32, 0.38);
      --text: #f5f9ff;
      --muted: rgba(245, 249, 255, 0.82);
      --line: rgba(255, 255, 255, 0.18);
      --input: rgba(255, 255, 255, 0.16);
      --input-focus: rgba(255, 255, 255, 0.22);
      --error-bg: rgba(34, 42, 58, 0.88);
      --error-border: rgba(255, 255, 255, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 26% 30%, rgba(91, 188, 255, 0.28), transparent 18%),
        radial-gradient(circle at 35% 50%, rgba(118, 204, 255, 0.22), transparent 24%),
        radial-gradient(circle at 62% 36%, rgba(255, 255, 255, 0.14), transparent 16%),
        radial-gradient(circle at 74% 56%, rgba(94, 192, 255, 0.22), transparent 24%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 46%, var(--bg-3));
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.03)),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02), transparent 35%, rgba(255, 255, 255, 0.04));
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -10% -4%;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.2), transparent 10%),
        linear-gradient(60deg, transparent 25%, rgba(180, 228, 255, 0.22) 45%, transparent 57%),
        linear-gradient(-60deg, transparent 25%, rgba(180, 228, 255, 0.18) 45%, transparent 57%);
      filter: blur(42px);
      opacity: 0.8;
      pointer-events: none;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    .centerStack {
      display: grid;
      justify-items: center;
      gap: 18px;
      text-align: center;
    }

    .bootStack {
      align-self: end;
      margin-bottom: 10vh;
      gap: 8px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: rgba(255, 255, 255, 0.95);
      animation: spin 0.85s linear infinite;
    }

    .loadingText {
      font-size: 0.98rem;
      letter-spacing: 0.01em;
      color: var(--muted);
    }

    .lockClock {
      font-size: clamp(4rem, 10vw, 6rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.03em;
      text-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
    }

    .lockDate {
      font-size: 1.15rem;
      color: rgba(245, 249, 255, 0.92);
      margin-bottom: 18px;
      text-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
    }

    .loginShell {
      width: min(380px, 100%);
      display: grid;
      justify-items: center;
      gap: 16px;
      text-align: center;
    }

    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.94);
      padding: 8px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
    }

    .userName {
      font-size: 2.1rem;
      font-weight: 400;
      margin: 0;
    }

    .passwordForm {
      width: min(300px, 100%);
      display: grid;
      gap: 12px;
      position: relative;
    }

    .passwordRow {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 0;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(30, 40, 58, 0.34);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .passwordInput,
    .submitBtn {
      height: 44px;
      border-radius: 0;
      border: 0;
      font: inherit;
    }

    .passwordInput {
      width: 100%;
      padding: 0 14px;
      color: var(--text);
      background: transparent;
      outline: none;
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .passwordInput::placeholder {
      color: rgba(245, 249, 255, 0.78);
    }

    .passwordInput:focus {
      background: var(--input-focus);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .submitBtn {
      cursor: pointer;
      color: var(--text);
      background: rgba(255, 255, 255, 0.12);
      font-size: 1.1rem;
      border-left: 1px solid rgba(255, 255, 255, 0.18);
    }

    .submitBtn:hover,
    .submitBtn:focus-visible {
      background: rgba(255, 255, 255, 0.18);
    }

    .helperText {
      color: var(--muted);
      font-size: 0.92rem;
      min-height: 1.35em;
    }

    .signInOptions {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .signInOptions::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.38);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12);
    }

    .errorPanel {
      width: min(300px, 100%);
      display: none;
      gap: 8px;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid var(--error-border);
      background: var(--error-bg);
      border-radius: 4px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(18px);
    }

    .errorPanel.show {
      display: grid;
    }

    .errorTitle {
      font-weight: 600;
    }

    .trainingNote {
      position: absolute;
      left: calc(100% + 18px);
      top: -2px;
      width: 250px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 233, 153, 0.48);
      background: rgba(78, 56, 10, 0.9);
      color: #fff7d6;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(10px);
      text-align: left;
      z-index: 2;
    }

    .trainingNote::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 28px;
      width: 18px;
      height: 18px;
      background: rgba(78, 56, 10, 0.9);
      border-left: 1px solid rgba(255, 233, 153, 0.48);
      border-bottom: 1px solid rgba(255, 233, 153, 0.48);
      transform: rotate(45deg);
    }

    .trainingNote strong {
      display: block;
      margin-bottom: 4px;
    }

    .utilityBar {
      position: fixed;
      right: 26px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(245, 249, 255, 0.94);
      font-size: 1rem;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    .utilityDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.72);
      opacity: 0.9;
    }

    .signInMessage {
      font-size: 2rem;
      font-weight: 300;
      margin: 0;
    }

    .signInSubtext {
      color: var(--muted);
      font-size: 1rem;
      min-height: 1.4em;
    }

    .shake {
      animation: shake 0.36s ease;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes shake {
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    @media (max-width: 640px) {
      .screen {
        padding: 20px;
      }

      .utilityBar {
        right: 18px;
        bottom: 18px;
      }

      .trainingNote {
        position: static;
        width: auto;
      }

      .trainingNote::before {
        display: none;
      }
    }
  </style>
</head>
<body>
  <section class="screen active" id="bootScreen" aria-label="Loading screen">
    <div class="centerStack bootStack">
      <div class="lockClock" id="clock"></div>
      <div class="lockDate" id="dateLine"></div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="loadingText">Loading sign-in</div>
    </div>
  </section>

  <section class="screen" id="loginScreen" aria-label="Login screen">
    <div class="loginShell">
      <img class="avatar" src="mdbadge.png" alt="Cadet user avatar" />
      <h1 class="userName">cadet</h1>

      <form class="passwordForm" id="passwordForm">
        <div class="passwordRow" id="passwordRow">
          <input
            class="passwordInput"
            id="passwordInput"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Password"
            aria-label="Password"
          />
          <button class="submitBtn" type="submit" aria-label="Sign in">
            &rarr;
          </button>
        </div>

        <div class="errorPanel" id="errorPanel" role="alert" aria-live="polite">
          <div class="errorTitle">Your password is incorrect.</div>
          <div>Try again.</div>
        </div>

        <div class="helperText" id="helperText">Sign in</div>
        <a class="signInOptions" href="#" aria-hidden="true" tabindex="-1">Sign-in options</a>
        <aside class="trainingNote">
          <strong>Training note</strong>
          Enter the password <code>Cyb3r!</code> to continue.
        </aside>
      </form>
    </div>
  </section>

  <section class="screen" id="signingInScreen" aria-label="Signing in screen">
    <div class="centerStack">
      <img class="avatar" src="mdbadge.png" alt="" aria-hidden="true" />
      <h2 class="signInMessage">Welcome</h2>
      <div class="spinner" aria-hidden="true"></div>
      <div class="signInSubtext" id="signInSubtext">Signing you in</div>
    </div>
  </section>

  <div class="utilityBar" aria-hidden="true">
    <div>🌐</div>
    <div>⌨</div>
    <div>🔋</div>
    <div class="utilityDot"></div>
  </div>

  <script>
    const bootScreen = document.getElementById("bootScreen");
    const loginScreen = document.getElementById("loginScreen");
    const signingInScreen = document.getElementById("signingInScreen");
    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("passwordInput");
    const passwordRow = document.getElementById("passwordRow");
    const errorPanel = document.getElementById("errorPanel");
    const helperText = document.getElementById("helperText");
    const signInSubtext = document.getElementById("signInSubtext");
    const clock = document.getElementById("clock");
    const dateLine = document.getElementById("dateLine");

    const correctPassword = "Cyb3r!";

    function showScreen(screen) {
      [bootScreen, loginScreen, signingInScreen].forEach(function (item) {
        item.classList.toggle("active", item === screen);
      });
    }

    function updateClock() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
      dateLine.textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric"
      });
    }

    function showLogin() {
      showScreen(loginScreen);
      window.setTimeout(function () {
        passwordInput.focus();
      }, 120);
    }

    function showError() {
      errorPanel.classList.add("show");
      helperText.textContent = "Sign-in failed";
      passwordRow.classList.remove("shake");
      void passwordRow.offsetWidth;
      passwordRow.classList.add("shake");
      passwordInput.select();
    }

    function clearError() {
      errorPanel.classList.remove("show");
      helperText.textContent = "Sign in";
      passwordRow.classList.remove("shake");
    }

    function beginSignInSequence() {
      clearError();
      showScreen(signingInScreen);
      const messages = [
        "Signing you in",
        "Checking your account",
        "Preparing your desktop"
      ];

      messages.forEach(function (message, idx) {
        window.setTimeout(function () {
          signInSubtext.textContent = message;
        }, idx * 1100);
      });

      window.setTimeout(function () {
        window.location.href = "desktop.html";
      }, 3600);
    }

    passwordInput.addEventListener("input", function () {
      if (errorPanel.classList.contains("show")) {
        clearError();
      }
    });

    passwordForm.addEventListener("submit", function (event) {
      event.preventDefault();
      if (passwordInput.value === correctPassword) {
        beginSignInSequence();
        return;
      }
      showError();
    });

    updateClock();
    window.setInterval(updateClock, 15000);
    window.setTimeout(showLogin, 1800);
  </script>
</body>
</html>
